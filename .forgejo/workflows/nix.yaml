name: Nix
on: [push, pull_request]
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: https://git.avali.network/avali.network/install-nix-action@v31
  fmt:
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - run: nix fmt -- --ci
  check:
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - run: nix flake check
