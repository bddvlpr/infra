name: Nix
on: [push, pull_request]
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: https://git.avali.network/avali.network/install-nix-action@v31
      - uses: actions/cache@v3
        with:
          key: ${{ runner.os }}-nix-${{ hashFiles('flake.lock') }}
          path: /nix/store
          restore-keys: |
            ${{ runner.os }}-nix-
      - run: nix fmt -- --ci
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          key: ${{ runner.os }}-nix-${{ hashFiles('flake.lock') }}
          path: /nix/store
          restore-keys: |
            ${{ runner.os }}-nix-
      - uses: https://git.avali.network/avali.network/install-nix-action@v31
      - run: nix flake check
